group = 'dev.linkbud.flutter'
version = '0.4.0'

buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20'
    }
}
apply plugin: 'com.android.library'

def libraryExtension = extensions.getByType(com.android.build.api.dsl.LibraryExtension)
libraryExtension.namespace = 'dev.linkbud.flutter'
libraryExtension.compileSdk = 36
libraryExtension.defaultConfig.minSdk = 26
libraryExtension.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
libraryExtension.compileOptions.targetCompatibility = JavaVersion.VERSION_17
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
repositories { google(); mavenCentral() }
dependencies { implementation 'com.android.installreferrer:installreferrer:2.2' }
