name: linkbud_flutter
description: Flutter plugin for LinkBud app-link resolution and explicit recovery on Android and iOS.
version: 1.0.0
repository: https://github.com/codel00ps/linkbud-flutter-sdk
environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: dev.linkbud.flutter
        pluginClass: LinkBudFlutterPlugin
      ios:
        pluginClass: LinkBudFlutterPlugin
